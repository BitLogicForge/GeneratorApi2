# MARK: Variables

variables:
  # Azure App Service targets
  AZURE_SUBSCRIPTION_ID: 'YOUR_SUBSCRIPTION_ID'
  AZURE_RESOURCE_GROUP: 'YOUR_RESOURCE_GROUP'
  AZURE_WEBAPP_NAME: 'YOUR_WEBAPP_NAME'
  AZURE_DEV_SLOT: 'dev'
  # Target branches for deployment
  PRODUCTION_BRANCH: 'main'
  DEV_BRANCH: 'dev'
  # Container images
  NODE_IMAGE: 'node:22-bookworm-slim'
  AZURE_CLI_IMAGE: 'mcr.microsoft.com/azure-cli:latest'
  # Deployment package location
  ZIP_PACKAGE: 'output/azure/generator-api.zip'
  # Suppress npm audit and funding messages in CI logs
  npm_config_audit: 'false'
  npm_config_fund: 'false'

# MARK: Default Cache
# Cache npm dependencies across jobs based on package-lock.json checksum
default:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

# MARK: Stages
stages:
  - test
  - build
  - deploy

# MARK: Workflow Rules
# Trigger pipeline on merge requests and target branches; prevent redundant runs
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $PRODUCTION_BRANCH || $CI_COMMIT_BRANCH == $DEV_BRANCH'
    - when: never

# MARK: Template: Node.js
# Base job template for Node.js tasks with cached dependency installation
.node_job:
  image:
    name: '$NODE_IMAGE'
    entrypoint: ['']
  before_script:
    - scripts/ci-section.sh npm_ci "Installing dependencies" npm ci --cache .npm --prefer-offline

# MARK: Test: Lint
# Static checks: Oxlint, TypeScript typecheck, Knip (unused exports), Prettier formatting
lint:
  extends: .node_job
  stage: test
  needs: []
  script:
    - scripts/ci-section.sh oxlint "Running Oxlint (code rules)" npm run lint:code
    - scripts/ci-section.sh typecheck "Running TypeScript typecheck" npm run typecheck
    - scripts/ci-section.sh knip "Running Knip (unused exports & dependencies)" npm run knip
    - scripts/ci-section.sh format "Checking Prettier formatting" npm run format:check

# MARK: Test: Unit Tests
# Executes node:test suite via tsx and exports JUnit XML report for GitLab CI
test:
  extends: .node_job
  stage: test
  needs: []
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull
  script:
    - scripts/ci-section.sh test "Running node:test suite" npx --no-install tsx --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=junit.xml "test/**/*.test.ts"
  artifacts:
    when: always
    reports:
      junit: junit.xml

# MARK: Build: ZIP Package
# Compiles bundle, prunes dev dependencies, bundles certs, and archives deployment ZIP
build:
  extends: .node_job
  stage: build
  needs: []
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull
  before_script:
    - which zip >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends zip ca-certificates)
    - scripts/ci-section.sh npm_ci "Installing dependencies" npm ci --cache .npm --prefer-offline
  script:
    - scripts/ci-section.sh compile "Compiling bundle with esbuild" npm run build
    - scripts/ci-section.sh prune "Pruning development dependencies" npm prune --omit=dev
    - scripts/ci-section.sh certs "Collecting container certificates" bash scripts/collect-certs.sh certs
    - scripts/ci-section.sh zip "Creating deployment ZIP archive" bash -c 'chmod +x scripts/start-azure.sh && mkdir -p "$(dirname "$ZIP_PACKAGE")" && zip -q -r "$ZIP_PACKAGE" dist package.json package-lock.json scripts/start-azure.sh templates node_modules certs'
  artifacts:
    paths:
      - '$ZIP_PACKAGE'
    expire_in: 1 week

# MARK: Templates: Azure Deploy
# Base job: Authenticate Azure CLI using Service Principal credentials
.azure_job:
  image:
    name: '$AZURE_CLI_IMAGE'
    entrypoint: ['']
  before_script:
    - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

# Deployment template: Configure App Service settings, deploy ZIP, and restart
.azure_deploy:
  extends: .azure_job
  stage: deploy
  needs:
    - job: lint
    - job: test
    - job: build
      artifacts: true
  variables:
    SLOT_ARGS: ''
    APP_SETTINGS: >-
      NODE_ENV=production
      API_HOST=0.0.0.0
      API_PORT=3000
      WEBSITES_ENABLE_APP_SERVICE_STORAGE=true
      PLAYWRIGHT_BROWSERS_PATH=/home/playwright
      WEBSITE_WARMUP_PATH=/internal/ready
      WEBSITE_WARMUP_STATUSES=200
  script:
    - TARGET="--resource-group $AZURE_RESOURCE_GROUP --name $AZURE_WEBAPP_NAME $SLOT_ARGS"
    - scripts/ci-section.sh az_config "Configuring Azure Web App startup and settings" bash -c "az webapp config set $TARGET --startup-file 'bash scripts/start-azure.sh' --output none && az webapp config appsettings set $TARGET --settings $APP_SETTINGS --output none"
    - scripts/ci-section.sh az_deploy "Deploying ZIP package to Azure Web App" az webapp deploy $TARGET --src-path "$ZIP_PACKAGE" --type zip --async false
    - scripts/ci-section.sh az_restart "Restarting Azure Web App" az webapp restart $TARGET

# MARK: Deploy: Production
# Deploys main branch to production Azure Web App slot
deploy_main:
  extends: .azure_deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $PRODUCTION_BRANCH'
  environment: production
  resource_group: azure-production

# MARK: Deploy: Dev Slot
# Deploys dev branch to staging/dev slot of Azure Web App
deploy_dev:
  extends: .azure_deploy
  variables:
    SLOT_ARGS: '--slot $AZURE_DEV_SLOT'
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH'
  environment: dev
  resource_group: azure-dev

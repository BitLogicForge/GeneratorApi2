# Edit these values for your Azure deployment.
# Keep AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, and AZURE_TENANT_ID
# in GitLab Settings > CI/CD > Variables.
variables:
  AZURE_SUBSCRIPTION_ID: 'YOUR_SUBSCRIPTION_ID'
  AZURE_RESOURCE_GROUP: 'YOUR_RESOURCE_GROUP'
  AZURE_WEBAPP_NAME: 'YOUR_WEBAPP_NAME'
  AZURE_DEV_SLOT: 'dev'
  PRODUCTION_BRANCH: 'main'
  DEV_BRANCH: 'dev'
  NODE_IMAGE: 'node:22-bookworm-slim'
  AZURE_CLI_IMAGE: 'mcr.microsoft.com/azure-cli:latest'
  ZIP_PACKAGE: 'output/azure/generator-api.zip'
  npm_config_audit: 'false'
  npm_config_fund: 'false'

stages:
  - build
  - deploy

workflow: # Define the workflow for the pipeline
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"' # Run for merge request events
    - if: '$CI_COMMIT_BRANCH == $PRODUCTION_BRANCH || $CI_COMMIT_BRANCH == $DEV_BRANCH' # Run for production or dev branch commits
    - when: never # Do not run for any other cases

.node_job:
  image:
    name: '$NODE_IMAGE'
    entrypoint: ['']

build:
  extends: .node_job
  stage: build
  before_script:
    - which zip >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends zip)
  script:
    - npm ci
    - npm run lint
    - npm test
    - npm run build
    - npm prune --omit=dev
    - chmod +x scripts/start-azure.sh
    - mkdir -p "$(dirname "$ZIP_PACKAGE")"
    - zip -q -r "$ZIP_PACKAGE" dist package.json package-lock.json scripts/start-azure.sh templates node_modules
  artifacts:
    paths:
      - '$ZIP_PACKAGE'
    expire_in: 1 week

.azure_job:
  image:
    name: '$AZURE_CLI_IMAGE'
    entrypoint: ['']
  before_script:
    - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

.azure_deploy:
  extends: .azure_job
  stage: deploy
  needs:
    - job: build
      artifacts: true
  variables:
    SLOT_ARGS: ''
    APP_SETTINGS: >-
      NODE_ENV=production
      HOST=0.0.0.0
      PORT=3000
      WEBSITES_ENABLE_APP_SERVICE_STORAGE=true
      PLAYWRIGHT_BROWSERS_PATH=/home/playwright
      WEBSITE_WARMUP_PATH=/internal/ready
      WEBSITE_WARMUP_STATUSES=200
  script:
    - TARGET="--resource-group $AZURE_RESOURCE_GROUP --name $AZURE_WEBAPP_NAME $SLOT_ARGS"
    - az webapp config set $TARGET --startup-file 'bash scripts/start-azure.sh' --output none
    - az webapp config appsettings set $TARGET --settings $APP_SETTINGS --output none
    - az webapp deploy $TARGET --src-path "$ZIP_PACKAGE" --type zip --async false
    - az webapp restart $TARGET

deploy_main:
  extends: .azure_deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $PRODUCTION_BRANCH'
  environment: production
  resource_group: azure-production

deploy_dev:
  extends: .azure_deploy
  variables:
    SLOT_ARGS: '--slot $AZURE_DEV_SLOT'
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH'
  environment: dev
  resource_group: azure-dev

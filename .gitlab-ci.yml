# Edit these values for your Azure deployment.
# Keep AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, and AZURE_TENANT_ID
# in GitLab Settings > CI/CD > Variables.
variables:
  AZURE_SUBSCRIPTION_ID: 'YOUR_SUBSCRIPTION_ID'
  AZURE_RESOURCE_GROUP: 'YOUR_RESOURCE_GROUP'
  AZURE_WEBAPP_NAME: 'YOUR_WEBAPP_NAME'
  AZURE_DEV_SLOT: 'dev'
  PRODUCTION_BRANCH: 'main'
  DEV_BRANCH: 'dev'
  NODE_IMAGE: 'node:22-bookworm-slim'
  AZURE_CLI_IMAGE: 'mcr.microsoft.com/azure-cli:latest'

stages:
  - verify
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $PRODUCTION_BRANCH || $CI_COMMIT_BRANCH == $DEV_BRANCH'
    - when: never

.node_job:
  image:
    name: '$NODE_IMAGE'
    entrypoint: ['']

verify:
  extends: .node_job
  stage: verify
  script:
    - npm ci --no-audit --no-fund
    - npm run lint
    - npm test
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

build_zip:
  extends: .node_job
  stage: build
  needs:
    - job: verify
      artifacts: true
  script:
    - npm run build:azure
  artifacts:
    paths:
      - output/azure/generator-api.zip
    expire_in: 1 week

.azure_job:
  image:
    name: '$AZURE_CLI_IMAGE'
    entrypoint: ['']
  before_script:
    - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

.azure_deploy:
  extends: .azure_job
  stage: deploy
  needs:
    - job: build_zip
      artifacts: true

deploy_main:
  extends: .azure_deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH == $PRODUCTION_BRANCH'
  environment:
    name: production
  resource_group: azure-production
  script:
    - >-
      az webapp config set
      --resource-group "$AZURE_RESOURCE_GROUP"
      --name "$AZURE_WEBAPP_NAME"
      --startup-file 'bash scripts/start-azure.sh'
      --output none
    - >-
      az webapp config appsettings set
      --resource-group "$AZURE_RESOURCE_GROUP"
      --name "$AZURE_WEBAPP_NAME"
      --settings NODE_ENV=production HOST=0.0.0.0 PORT=3000
      WEBSITES_ENABLE_APP_SERVICE_STORAGE=true
      PLAYWRIGHT_BROWSERS_PATH=/home/playwright
      WEBSITE_WARMUP_PATH=/internal/ready WEBSITE_WARMUP_STATUSES=200
      --output none
    - >-
      az webapp deploy
      --resource-group "$AZURE_RESOURCE_GROUP"
      --name "$AZURE_WEBAPP_NAME"
      --src-path output/azure/generator-api.zip
      --type zip
      --async false
    - az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME"

deploy_dev:
  extends: .azure_deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH == $DEV_BRANCH'
  environment:
    name: dev
  resource_group: azure-dev
  script:
    - >-
      az webapp config set
      --resource-group "$AZURE_RESOURCE_GROUP"
      --name "$AZURE_WEBAPP_NAME"
      --slot "$AZURE_DEV_SLOT"
      --startup-file 'bash scripts/start-azure.sh'
      --output none
    - >-
      az webapp config appsettings set
      --resource-group "$AZURE_RESOURCE_GROUP"
      --name "$AZURE_WEBAPP_NAME"
      --slot "$AZURE_DEV_SLOT"
      --settings NODE_ENV=production HOST=0.0.0.0 PORT=3000
      WEBSITES_ENABLE_APP_SERVICE_STORAGE=true
      PLAYWRIGHT_BROWSERS_PATH=/home/playwright
      WEBSITE_WARMUP_PATH=/internal/ready WEBSITE_WARMUP_STATUSES=200
      --output none
    - >-
      az webapp deploy
      --resource-group "$AZURE_RESOURCE_GROUP"
      --name "$AZURE_WEBAPP_NAME"
      --slot "$AZURE_DEV_SLOT"
      --src-path output/azure/generator-api.zip
      --type zip
      --async false
    - az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --slot "$AZURE_DEV_SLOT"

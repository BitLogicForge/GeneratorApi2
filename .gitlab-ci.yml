# Edit these values for your Azure deployment.
# Keep AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, and AZURE_TENANT_ID
# in GitLab Settings > CI/CD > Variables.
variables:
  AZURE_SUBSCRIPTION_ID: 'YOUR_SUBSCRIPTION_ID'
  AZURE_RESOURCE_GROUP: 'YOUR_RESOURCE_GROUP'
  AZURE_WEBAPP_NAME: 'YOUR_WEBAPP_NAME'
  AZURE_DEV_SLOT: 'dev'
  PRODUCTION_BRANCH: 'main'
  DEV_BRANCH: 'dev'
  NODE_IMAGE: 'node:22-bookworm'
  AZURE_CLI_IMAGE: 'mcr.microsoft.com/azure-cli:latest'
  # Must match the output path in scripts/build-azure.mjs.
  AZURE_ZIP_PATH: 'output/azure/generator-api.zip'
  PLAYWRIGHT_BROWSERS_PATH: '$CI_PROJECT_DIR/.cache/ms-playwright'

stages:
  - verify
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $PRODUCTION_BRANCH || $CI_COMMIT_BRANCH == $DEV_BRANCH'
    - when: never

.node_job:
  image: '$NODE_IMAGE'
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .cache/ms-playwright/

verify:
  extends: .node_job
  stage: verify
  script:
    - npm ci --no-audit --no-fund
    - npm run verify:ci

build_zip:
  extends: .node_job
  stage: build
  needs:
    - job: verify
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && ($CI_COMMIT_BRANCH == $PRODUCTION_BRANCH || $CI_COMMIT_BRANCH == $DEV_BRANCH)'
  script:
    - npm ci --no-audit --no-fund
    - npm run browser:install
    - npm run build:azure
    - npm run test:azure
  artifacts:
    paths:
      - '$AZURE_ZIP_PATH'
    expire_in: 1 week

.azure_deploy:
  stage: deploy
  image:
    name: '$AZURE_CLI_IMAGE'
    entrypoint: ['']
  needs:
    - job: build_zip
      artifacts: true
  before_script:
    - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

deploy_main:
  extends: .azure_deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH == $PRODUCTION_BRANCH'
  environment:
    name: production
  resource_group: azure-production
  script:
    - >-
      az webapp deploy
      --resource-group "$AZURE_RESOURCE_GROUP"
      --name "$AZURE_WEBAPP_NAME"
      --src-path "$AZURE_ZIP_PATH"
      --type zip

deploy_dev:
  extends: .azure_deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH == $DEV_BRANCH'
  environment:
    name: dev
  resource_group: azure-dev
  script:
    - >-
      az webapp deploy
      --resource-group "$AZURE_RESOURCE_GROUP"
      --name "$AZURE_WEBAPP_NAME"
      --slot "$AZURE_DEV_SLOT"
      --src-path "$AZURE_ZIP_PATH"
      --type zip
